
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>wikiuniverse viewer v3</title>
<style>
  body{margin:0;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
  #ui{position:absolute;top:10px;left:12px;color:#9ab;font:12px/1.7 monospace;z-index:5}
  #panel{position:absolute;top:10px;right:12px;width:340px;max-height:80vh;overflow:auto;
         background:rgba(8,10,16,.88);color:#cde;font:12px/1.55 monospace;
         padding:10px 14px;border:1px solid #2a3040;border-radius:8px;z-index:5}
  #panel h3{margin:0 0 6px;font-size:14px;color:#fff}
  #tip{position:absolute;pointer-events:none;background:rgba(10,14,22,.92);color:#def;
       font:11px monospace;padding:3px 8px;border:1px solid #345;border-radius:4px;
       display:none;z-index:9;white-space:nowrap}
  #fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;
        transition:opacity .28s;z-index:8}
  #ui input[type=range]{width:140px;vertical-align:middle}
  #q{background:#10141c;color:#cde;border:1px solid #345;border-radius:4px;
     padding:2px 6px;font:12px monospace;width:160px}
  button{background:#1a2230;color:#cde;border:1px solid #345;border-radius:4px;
         padding:2px 9px;font:12px monospace;cursor:pointer}
  button.on{background:#2a4a6a;border-color:#5af}
  .dim{color:#678} .j{color:#8cf;cursor:pointer;text-decoration:underline}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="ui">
  <div>wikiuniverse <b>v3</b>(nested-scale)— <span id="stage">universe</span>
       <span id="stats" class="dim"></span></div>
  <div>z-compress <input id="zsq" type="range" min="0.40" max="1" step="0.05" value="1">
       <span id="zv">1.00</span>
       <button id="back" style="display:none">&larr; back (Esc)</button></div>
  <div><input id="q" placeholder="search galaxy / macro…"></div>
  <div><button id="tEdges" class="on">edges</button>
       <button id="tBundles" class="on">cross</button>
       <button id="tMacros" class="on">shells</button>
       <button id="tLabels" class="on">labels</button>
       <button id="tDust" class="on">dust</button></div>
  <div class="dim">click halo=enter · click star=links · click ring neighbour=jump ·
       drag=orbit · wheel=zoom</div>
</div>
<div id="panel"><h3>wikiuniverse</h3><div id="pbody">loading…</div></div>
<div id="tip"></div><div id="fade"></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const BASE = '../data/spatial/';
const B = await (await fetch(BASE+'bootstrap.json')).json();
const G = B.galaxies.length;
// NOTE: layout coords are scale-free; UNIVERSE_SCALE multiplies everything if a
// bigger physical stage is ever wanted (ratios, not absolutes, carry the meaning).
const US = 1.0;
const FOCUS_R = 320;            // focused galaxy ball radius in view units
const R_CTX   = FOCUS_R * 2.35; // neighbour ring radius
const col = c => new THREE.Color().setHSL(((c*137.508)%360)/360, .72, .60);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.00009);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.2, 500000);
camera.position.set(0, -3600*US, 2100*US);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
const PR = renderer.getPixelRatio();

function radialTex(stops){ const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d'), gr=g.createRadialGradient(32,32,0,32,32,32);
  stops.forEach(s=>gr.addColorStop(s[0],s[1])); g.fillStyle=gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c); }
const STAR_TEX = radialTex([[0,'rgba(255,255,255,1)'],[.25,'rgba(255,255,255,.9)'],
                            [.55,'rgba(210,230,255,.28)'],[1,'rgba(210,230,255,0)']]);
function labelTex(text){ const c=document.createElement('canvas');
  let g=c.getContext('2d'); g.font='28px monospace';
  const w=Math.ceil(g.measureText(text).width)+16; c.width=w; c.height=40;
  g=c.getContext('2d'); g.font='28px monospace'; g.fillStyle='rgba(220,230,255,.95)';
  g.fillText(text,8,28); const t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter;
  return [t,w/40]; }
const STAR_VS = `attribute float aSize; attribute vec3 aColor; varying vec3 vC;
void main(){ vC=aColor; vec4 mv=modelViewMatrix*vec4(position,1.0);
  gl_Position=projectionMatrix*mv; gl_PointSize=aSize; }`;
const STAR_FS = `uniform sampler2D uMap; varying vec3 vC;
void main(){ vec4 t=texture2D(uMap,gl_PointCoord); if(t.a<0.02) discard;
  gl_FragColor=vec4(vC,1.0)*t; }`;
function starMaterial(){ return new THREE.ShaderMaterial({
  uniforms:{uMap:{value:STAR_TEX}}, vertexShader:STAR_VS, fragmentShader:STAR_FS,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}); }

let zK = 1.0;
const gPos = B.galaxies.map(g=>new THREE.Vector3(g[0]*US, g[1]*US, g[2]*US));
const mPos = B.macros.map(m=>new THREE.Vector3(m[0]*US, m[1]*US, m[2]*US));
const gz = i => B.galaxies[i][2]*US*zK, mz = i => B.macros[i][2]*US*zK;

// background starfield
{ const N=2600, p=new Float32Array(N*3);
  for(let i=0;i<N;i++){ const v=new THREE.Vector3().randomDirection()
      .multiplyScalar((50000+Math.random()*50000)*US); p.set([v.x,v.y,v.z],i*3); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:2.2,map:STAR_TEX,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,color:0x8899bb,
    opacity:.5,sizeAttenuation:false}))); }

// ================= universe layer =================
const gUni = new THREE.Group(); scene.add(gUni);
const halo = new THREE.InstancedMesh(new THREE.SphereGeometry(1,12,9),
  new THREE.MeshBasicMaterial({transparent:true,opacity:.14,
    blending:THREE.AdditiveBlending,depthWrite:false}), G);
const coreI = new THREE.InstancedMesh(new THREE.SphereGeometry(1,10,8),
  new THREE.MeshBasicMaterial(), G);
const haloR = new Float32Array(G), coreR = new Float32Array(G);
const m4 = new THREE.Matrix4();
function paintGalaxies(){
  B.galaxies.forEach((g,i)=>{
    haloR[i]=Math.max(g[3],.8)*US*1.55; coreR[i]=Math.max(g[3],.8)*US*.30;
    m4.makeScale(haloR[i],haloR[i],haloR[i]); m4.setPosition(gPos[i].x,gPos[i].y,gz(i));
    halo.setMatrixAt(i,m4);
    halo.setColorAt(i, g[5]===1?new THREE.Color(0x666666):g[5]===2?new THREE.Color(0x222222):col(g[4]));
    m4.makeScale(coreR[i],coreR[i],coreR[i]); m4.setPosition(gPos[i].x,gPos[i].y,gz(i));
    coreI.setMatrixAt(i,m4);
    coreI.setColorAt(i, g[5]===1?new THREE.Color(0x999999):g[5]===2?new THREE.Color(0x333333):col(g[4]));
  });
  halo.instanceMatrix.needsUpdate=true; coreI.instanceMatrix.needsUpdate=true;
  if(halo.instanceColor) halo.instanceColor.needsUpdate=true;
  if(coreI.instanceColor) coreI.instanceColor.needsUpdate=true;
}
paintGalaxies(); gUni.add(halo); gUni.add(coreI);

const gMacros = new THREE.Group(); gUni.add(gMacros);
const macroLabels = new THREE.Group(); gUni.add(macroLabels);
const macroObjs = [];
function buildMacros(){
  gMacros.clear(); macroLabels.clear(); macroObjs.length=0;
  B.macros.forEach((m,i)=>{ if(m[4]<=1) return;
    const w=new THREE.LineSegments(new THREE.WireframeGeometry(
        new THREE.SphereGeometry(m[3]*US,12,8)),
        new THREE.LineBasicMaterial({color:0x334455,transparent:true,opacity:.07}));
    w.position.set(mPos[i].x,mPos[i].y,mz(i)); w.userData.r=m[3]*US;
    gMacros.add(w); macroObjs.push(w); });
  B.macros.map((m,i)=>[m[4],i]).sort((a,b)=>b[0]-a[0]).slice(0,10).forEach(([n,i])=>{
    const m=B.macros[i]; const [t,ar]=labelTex((m[5]||('macro#'+i)).slice(0,14));
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,
        opacity:.7,depthWrite:false}));
    sp.scale.set(40*ar,40,1); sp.position.set(mPos[i].x,mPos[i].y+m[3]*US*zK*1.05,mz(i));
    macroLabels.add(sp); });
}
buildMacros();

function curvedLines(pairs, get, color, opac, bow=.18){
  const pos=[];
  pairs.forEach(p=>{ const a=get(p[0]), b=get(p[1]);
    const mid=a.clone().add(b).multiplyScalar(.5);
    const dir=b.clone().sub(a); const L=dir.length();
    const perp=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,0,1)).normalize();
    if(perp.lengthSq()<1e-6) perp.set(1,0,0);
    mid.addScaledVector(perp, L*bow*(((p[2]||1)%7)-3)/3);
    const av=new THREE.Vector3(a.x,a.y,a.z*zK), bv=new THREE.Vector3(b.x,b.y,b.z*zK);
    const mv2=new THREE.Vector3(mid.x,mid.y,mid.z*zK);
    new THREE.QuadraticBezierCurve3(av,mv2,bv).getPoints(10).forEach((v,i,arr)=>{
      if(i) pos.push(arr[i-1].x,arr[i-1].y,arr[i-1].z,v.x,v.y,v.z); }); });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  return new THREE.LineSegments(g,new THREE.LineBasicMaterial({color,transparent:true,
    opacity:opac,blending:THREE.AdditiveBlending,depthWrite:false}));
}
const bundleLines = new THREE.Group(); gUni.add(bundleLines);
function buildBundles(){ bundleLines.clear();
  bundleLines.add(curvedLines(B.macro_pairs.slice(0,400), i=>mPos[i], 0x557799, .5));
  bundleLines.add(curvedLines(B.galaxy_pairs.slice(0,6000), i=>gPos[i], 0x335577, .15)); }
buildBundles();

const dustIdx = B.galaxies.map((g,i)=>i).filter(i=>B.galaxies[i][5]===2);
let dustPts=null;
{ const p=new Float32Array(dustIdx.length*3);
  dustIdx.forEach((gi,k)=>p.set([gPos[gi].x,gPos[gi].y,gz(gi)],k*3));
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  dustPts=new THREE.Points(g,new THREE.PointsMaterial({size:1.6,map:STAR_TEX,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,color:0x445566,
    opacity:.55,sizeAttenuation:false}));
  gUni.add(dustPts); }

// ================= focus (scale-separated) layer =================
const gFoc = new THREE.Group(); gFoc.visible=false; scene.add(gFoc);
const gArt = new THREE.Group(); scene.add(gArt);   // article-highlight lines
let focus=-1, curTile=null, artPts=null, ringSprites=[];
const panel=document.getElementById('pbody'), stageEl=document.getElementById('stage');
const statsEl=document.getElementById('stats'), tip=document.getElementById('tip');
const fadeEl=document.getElementById('fade');
function clearGroup(gr){ while(gr.children.length){ const c=gr.children.pop();
  c.geometry&&c.geometry.dispose(); c.material&&c.material.dispose(); } }
function fade(){ fadeEl.style.opacity=1; setTimeout(()=>fadeEl.style.opacity=0, 60); }

const tileCache=new Map();
async function tile(g){ if(tileCache.has(g)) return tileCache.get(g);
  const pad=String(g).padStart(6,'0');
  const [buf,tj]=await Promise.all([
    (await fetch(BASE+`tiles/gal_${pad}.bin`)).arrayBuffer(),
    (await fetch(BASE+`tiles/gal_${pad}.json`)).json()]);
  const dv=new DataView(buf);
  const n=dv.getUint32(0,true), ne=dv.getUint32(4,true), nx=dv.getUint32(8,true);
  const t={n,ne,nx,pos:new Float32Array(buf,12,n*3),
    edges:new Uint32Array(buf,12+n*12,ne*2),
    cross:new Uint32Array(buf,12+n*12+ne*8,nx*3),titles:tj.t,objs:[]};
  if(tileCache.size>40) tileCache.delete(tileCache.keys().next().value);
  tileCache.set(g,t); return t; }

async function enterGalaxy(g, fly=true){
  if(focus===g) return;
  if(focus>=0) leaveGalaxy(false);
  fade();
  focus=g; curTile=await tile(g);
  const bg=B.galaxies[g], t=curTile;
  const cx=bg[0]*US, cy=bg[1]*US, cz=bg[2]*US*zK;
  const r_g=Math.max(bg[3],.8)*US;
  const s_in=FOCUS_R/r_g;
  stageEl.textContent=`galaxy #${g} ${bg[7]||''}`;
  document.getElementById('back').style.display='';
  scene.fog.density=1.1/(R_CTX*3);
  gUni.visible=false; gFoc.visible=true; clearGroup(gFoc); ringSprites=[];
  // article stars: screen-px sizes, local scale-separated coords
  const deg=new Uint16Array(t.n);
  for(let i=0;i<t.ne;i++){ deg[t.edges[2*i]]++; deg[t.edges[2*i+1]]++; }
  const posA=new Float32Array(t.n*3), szA=new Float32Array(t.n), colA=new Float32Array(t.n*3);
  const base=col(bg[4]), c2=new THREE.Color();
  for(let i=0;i<t.n;i++){
    posA.set([(t.pos[3*i]-cx)*s_in,(t.pos[3*i+1]-cy)*s_in,(t.pos[3*i+2]-cz)*s_in],i*3);
    szA[i]=PR*Math.min(2.6+deg[i]*0.35, 9);
    c2.copy(base).offsetHSL(0,0,Math.min(.35,deg[i]/60)); colA.set([c2.r,c2.g,c2.b],i*3); }
  const pg=new THREE.BufferGeometry();
  pg.setAttribute('position',new THREE.BufferAttribute(posA,3));
  pg.setAttribute('aSize',new THREE.BufferAttribute(szA,1));
  pg.setAttribute('aColor',new THREE.BufferAttribute(colA,3));
  artPts=new THREE.Points(pg,starMaterial()); gFoc.add(artPts); t.objs.push(artPts);
  // internal links
  if(show.edges){ const stride=Math.max(1,Math.floor(t.ne/150000)); const lp=[];
    for(let i=0;i<t.ne;i+=stride){ const a=t.edges[2*i],b=t.edges[2*i+1];
      lp.push((t.pos[3*a]-cx)*s_in,(t.pos[3*a+1]-cy)*s_in,(t.pos[3*a+2]-cz)*s_in,
              (t.pos[3*b]-cx)*s_in,(t.pos[3*b+1]-cy)*s_in,(t.pos[3*b+2]-cz)*s_in); }
    const lg=new THREE.BufferGeometry();
    lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lp),3));
    const ll=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x2a4a66,
        transparent:true,opacity:.3,blending:THREE.AdditiveBlending,depthWrite:false}));
    gFoc.add(ll); t.objs.push(ll); }
  // neighbour ring (context outside the galaxy)
  const nb=new Map();
  for(let i=0;i<t.nx;i+=3) nb.set(t.cross[i+1],(nb.get(t.cross[i+1])||0)+1);
  const nbs=[...nb.entries()].sort((a,b)=>b[1]-a[1]).slice(0,16);
  const ringPos=new Map();
  nbs.forEach(([og,cnt],k)=>{ const o=B.galaxies[og];
    const d=new THREE.Vector3(o[0]*US-cx,o[1]*US-cy,(o[2]*US-cz));
    if(d.lengthSq()<1e-9) d.set(Math.cos(k),Math.sin(k),0);
    d.normalize().multiplyScalar(R_CTX);
    ringPos.set(og,d);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:HALO_SPR,
        color:col(o[4]),transparent:true,opacity:.85,depthWrite:false,
        blending:THREE.AdditiveBlending}));
    const sz=26+Math.log1p(cnt)*16; sp.scale.set(sz,sz,1); sp.position.copy(d);
    sp.userData.g=og; gFoc.add(sp); ringSprites.push(sp); t.objs.push(sp);
    if(show.labels){ const [tt,ar]=labelTex((o[7]||('#'+og)).slice(0,16));
      const lb=new THREE.Sprite(new THREE.SpriteMaterial({map:tt,transparent:true,
          opacity:.8,depthWrite:false}));
      lb.scale.set(15*ar,15,1); lb.position.copy(d).multiplyScalar(1.12);
      gFoc.add(lb); t.objs.push(lb); } });
  // cross arcs: article -> ring neighbour point
  if(show.bundles){ const xp=[]; let cnt2=0;
    for(let i=0;i<t.nx && cnt2<1200;i+=3){ const og=t.cross[i+1]; const rp=ringPos.get(og);
      if(!rp) continue;
      const a=new THREE.Vector3((t.pos[3*t.cross[i]]-cx)*s_in,
          (t.pos[3*t.cross[i]+1]-cy)*s_in,(t.pos[3*t.cross[i]+2]-cz)*s_in);
      const mid=a.clone().add(rp).multiplyScalar(.5);
      mid.multiplyScalar(1.12);
      new THREE.QuadraticBezierCurve3(a,mid,rp).getPoints(8).forEach((v,i2,arr)=>{
        if(i2) xp.push(arr[i2-1].x,arr[i2-1].y,arr[i2-1].z,v.x,v.y,v.z); });
      cnt2++; }
    if(xp.length){ const xg=new THREE.BufferGeometry();
      xg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(xp),3));
      const xl=new THREE.LineSegments(xg,new THREE.LineBasicMaterial({color:0xbb55bb,
          transparent:true,opacity:.34,blending:THREE.AdditiveBlending,depthWrite:false}));
      gFoc.add(xl); t.objs.push(xl); } }
  // parent macro shell + universe backdrop
  if(show.macros){ const sh=new THREE.LineSegments(new THREE.WireframeGeometry(
      new THREE.SphereGeometry(R_CTX*1.45,18,12)),
      new THREE.LineBasicMaterial({color:0x334455,transparent:true,opacity:.10}));
    gFoc.add(sh); t.objs.push(sh);
    const bk=new THREE.LineSegments(new THREE.WireframeGeometry(
        new THREE.SphereGeometry(R_CTX*2.6,14,10)),
        new THREE.LineBasicMaterial({color:0x222233,transparent:true,opacity:.05}));
    gFoc.add(bk); t.objs.push(bk); }
  if(fly){ controls.target.set(0,0,0);
    camera.position.set(0,-FOCUS_R*3.0,FOCUS_R*1.7); }
  panelGalaxy(g,deg,nbs);
}
const HALO_SPR = radialTex([[0,'rgba(255,255,255,.9)'],[.35,'rgba(255,255,255,.35)'],
                            [1,'rgba(255,255,255,0)']]);
function leaveGalaxy(back=true){
  if(focus<0) return;
  fade();
  curTile.objs.forEach(o=>{o.geometry&&o.geometry.dispose();o.material&&o.material.dispose();});
  curTile.objs=[]; clearGroup(gFoc); clearGroup(gArt); artPts=null; curTile=null;
  ringSprites=[]; focus=-1;
  gFoc.visible=false; gUni.visible=true;
  scene.fog.density=0.00009;
  stageEl.textContent='universe';
  document.getElementById('back').style.display='none';
  if(back){ anim={t0:performance.now(),dur:700,p0:camera.position.clone(),
    p1:new THREE.Vector3(0,-3600*US,2100*US),q0:controls.target.clone(),
    q1:new THREE.Vector3(0,0,0)}; }
  panelUniverse();
}
function panelUniverse(){ panel.innerHTML=`<h3>wikiuniverse</h3>
  <div>${B.meta.n_articles.toLocaleString()} articles / ${G.toLocaleString()} galaxies /
  ${B.macros.length} macros</div>
  <div class="dim">nested-scale viewer v3: a focused galaxy is drawn at comfort scale;
  its neighbours / parent macro / universe appear as context shells outside.
  click a halo to enter.</div>`; }
function panelGalaxy(g,deg,nbs){ const bg=B.galaxies[g], t=curTile;
  panel.innerHTML=`<h3>${bg[7]||('galaxy #'+g)}</h3>
   <div>articles ${bg[6].toLocaleString()} · internal links ${t.ne.toLocaleString()} ·
   cross ${t.nx.toLocaleString()}</div>
   <div class="dim">macro #${bg[4]} · ${bg[5]===1?'MEDIUM':bg[5]===2?'dust':'galaxy'} ·
   e_in ${(bg[8]||0).toLocaleString()} / e_out ${(bg[9]||0).toLocaleString()}</div>
   <div style="margin-top:6px">${nbs.slice(0,8).map(([og,c])=>
     `<span class="j" data-g="${og}">${B.galaxies[og][7]||('#'+og)}</span>(${c}) `).join('')}</div>
   <div class="dim">ring sprites = neighbours (click to jump) · click a star for its links</div>`;
  panel.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>enterGalaxy(+el.dataset.g)); }
async function showArticle(local){
  const t=curTile, bg=B.galaxies[focus];
  clearGroup(gArt);
  const cx=bg[0]*US, cy=bg[1]*US, cz=bg[2]*US*zK;
  const s_in=FOCUS_R/(Math.max(bg[3],.8)*US);
  const title=t.titles[local]||'?';
  let deg=0; const lp=[];
  const A=i=>[(t.pos[3*i]-cx)*s_in,(t.pos[3*i+1]-cy)*s_in,(t.pos[3*i+2]-cz)*s_in];
  for(let i=0;i<t.ne;i++){ const a=t.edges[2*i],b=t.edges[2*i+1];
    if(a===local||b===local){ deg++; lp.push(...A(a),...A(b)); } }
  if(lp.length){ const g2=new THREE.BufferGeometry();
    g2.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lp),3));
    gArt.add(new THREE.LineSegments(g2,new THREE.LineBasicMaterial({color:0x88ddff,
      transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}))); }
  const targets=[];
  for(let i=0;i<t.nx;i+=3){ if(t.cross[i]!==local) continue;
    const og=t.cross[i+1], ov=t.cross[i+2];
    let ot; try{ ot=await tile(og); }catch(e){ continue; }
    targets.push([og,ov,ot.titles[ov]]); }
  // magenta arcs to ring points of the target galaxies
  const rp=new Map(); ringSprites.forEach(sp=>rp.set(sp.userData.g, sp.position));
  const xp=[];
  targets.forEach(([og])=>{ const r=rp.get(og); if(!r) return;
    const a=new THREE.Vector3(...A(local));
    const mid=a.clone().add(r).multiplyScalar(.5).multiplyScalar(1.1);
    new THREE.QuadraticBezierCurve3(a,mid,r.clone()).getPoints(8).forEach((v,i,arr)=>{
      if(i) xp.push(arr[i-1].x,arr[i-1].y,arr[i-1].z,v.x,v.y,v.z); }); });
  if(xp.length){ const g3=new THREE.BufferGeometry();
    g3.setAttribute('position',new THREE.BufferAttribute(new Float32Array(xp),3));
    gArt.add(new THREE.LineSegments(g3,new THREE.LineBasicMaterial({color:0xff66cc,
      transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}))); }
  panel.innerHTML=`<h3>${title}</h3>
    <div>galaxy: ${bg[7]||('#'+focus)} · internal deg ${deg} · cross ${targets.length}</div>
    <div style="margin-top:6px">${targets.map(([og,ov,tt],i)=>
      `<div><span class="j" data-t="${i}">${(tt||'?').slice(0,34)} →
       ${(B.galaxies[og][7]||'#'+og).slice(0,18)}</span></div>`).join('')}</div>
    <div class="dim" style="margin-top:6px"><span class="j" data-close="1">close</span></div>`;
  panel.querySelectorAll('[data-t]').forEach(el=>el.onclick=async()=>{
    const [og,ov]=targets[+el.dataset.t]; await enterGalaxy(og); showArticle(ov); });
  panel.querySelector('[data-close]').onclick=()=>clearGroup(gArt);
}

// ---------- picking / hover ----------
const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2(); let hoverT=0;
renderer.domElement.addEventListener('pointermove',ev=>{
  const now=performance.now(); if(now-hoverT<90) return; hoverT=now;
  mouse.x=(ev.clientX/innerWidth)*2-1; mouse.y=-(ev.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera); let txt='';
  if(focus>=0){ const h=ray.intersectObjects(ringSprites);
    if(h.length) txt=(B.galaxies[h[0].object.userData.g][7]||'')+ '  (jump)';
    if(!txt&&artPts){ ray.params.Points={threshold:FOCUS_R/90};
      const h2=ray.intersectObject(artPts);
      if(h2.length) txt=curTile.titles[h2[0].index]||''; } }
  if(!txt&&focus<0){ const h=ray.intersectObject(halo);
    if(h.length){ const g=B.galaxies[h[0].instanceId];
      txt=`${g[7]||'galaxy #'+h[0].instanceId}  (${g[6].toLocaleString()} articles)`; } }
  if(txt){ tip.style.display='block'; tip.style.left=(ev.clientX+14)+'px';
    tip.style.top=(ev.clientY+10)+'px'; tip.textContent=txt; }
  else tip.style.display='none'; });
renderer.domElement.addEventListener('click',async ev=>{
  mouse.x=(ev.clientX/innerWidth)*2-1; mouse.y=-(ev.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  if(focus>=0){ const hr=ray.intersectObjects(ringSprites);
    if(hr.length){ enterGalaxy(hr[0].object.userData.g); return; }
    if(artPts){ ray.params.Points={threshold:FOCUS_R/90};
      const h=ray.intersectObject(artPts);
      if(h.length){ showArticle(h[0].index); return; } }
    return; }
  const h=ray.intersectObject(halo);
  if(h.length) enterGalaxy(h[0].instanceId); });

// ---------- UI ----------
const show={edges:true,bundles:true,macros:true,labels:true,dust:true};
function bindToggle(id,key,fn){ const el=document.getElementById(id);
  el.onclick=()=>{ show[key]=!show[key]; el.classList.toggle('on',show[key]); fn&&fn(); }; }
bindToggle('tMacros','macros',()=>{ gMacros.visible=show.macros;
  if(focus>=0){const g=focus;leaveGalaxy(false);enterGalaxy(g,false);} });
bindToggle('tLabels','labels',()=>{ macroLabels.visible=show.labels;
  if(focus>=0){const g=focus;leaveGalaxy(false);enterGalaxy(g,false);} });
bindToggle('tDust','dust',()=>{ dustPts.visible=show.dust; });
bindToggle('tBundles','bundles',()=>{ bundleLines.visible=show.bundles;
  if(focus>=0){const g=focus;leaveGalaxy(false);enterGalaxy(g,false);} });
bindToggle('tEdges','edges',()=>{ if(focus>=0){const g=focus;leaveGalaxy(false);enterGalaxy(g,false);} });
document.getElementById('back').onclick=()=>leaveGalaxy(true);
addEventListener('keydown',e=>{ if(e.key==='Escape'){ clearGroup(gArt);
  if(focus>=0) leaveGalaxy(true); } });
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const q=e.target.value.trim().toLowerCase(); if(!q) return;
  let bi=-1; B.galaxies.forEach((g,i)=>{ if(bi<0&&g[7]&&g[7].toLowerCase().includes(q)) bi=i; });
  if(bi>=0){ enterGalaxy(bi); return; }
  let mi=-1; B.macros.forEach((m,i)=>{ if(mi<0&&m[5]&&m[5].toLowerCase().includes(q)) mi=i; });
  if(mi>=0){ const m=B.macros[mi];
    anim={t0:performance.now(),dur:800,p0:camera.position.clone(),
      p1:new THREE.Vector3(mPos[mi].x,mPos[mi].y-m[3]*US*2.4,mz(mi)),
      q0:controls.target.clone(),q1:mPos[mi].clone().setZ(mz(mi))}; }
  else panel.innerHTML='<h3>not found</h3>'; });
const zsl=document.getElementById('zsq');
zsl.addEventListener('input',()=>{ zK=parseFloat(zsl.value);
  document.getElementById('zv').textContent=zK.toFixed(2);
  paintGalaxies(); buildMacros(); buildBundles();
  { const p=dustPts.geometry.attributes.position;
    dustIdx.forEach((gi,k)=>{ p.array[k*3+2]=gz(gi); }); p.needsUpdate=true; }
  if(focus>=0){ const g=focus; leaveGalaxy(false); enterGalaxy(g,false); } });

// ---------- per-frame: min angular size clamp (dynamic entity sizes) ----------
const tanH = () => Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
function pxWorld(d,px){ return 2*d*tanH()*px/innerHeight; }
const _v=new THREE.Vector3();
function dynamicSizes(){
  if(focus>=0) return;
  let upd=false;
  for(let i=0;i<G;i++){
    _v.set(gPos[i].x,gPos[i].y,gz(i));
    const d=camera.position.distanceTo(_v);
    const minH=pxWorld(d, B.galaxies[i][5]===2?1.2:4.5);
    const eh=Math.max(haloR[i],minH), ec=Math.max(coreR[i],minH*.45);
    m4.makeScale(eh,eh,eh); m4.setPosition(_v); halo.setMatrixAt(i,m4);
    m4.makeScale(ec,ec,ec); m4.setPosition(_v); coreI.setMatrixAt(i,m4);
    upd=true; }
  if(upd){ halo.instanceMatrix.needsUpdate=true; coreI.instanceMatrix.needsUpdate=true; }
  macroObjs.forEach(w=>{ const d=camera.position.distanceTo(w.position);
    const s=Math.max(w.userData.r, pxWorld(d,9)); const k=s/w.userData.r;
    w.scale.set(k,k,k); });
}

// ---------- loop ----------
let anim=null, frames=0, fpsT=performance.now(), fps=0;
function loop(){ requestAnimationFrame(loop);
  const now=performance.now();
  if(anim){ const k=Math.min(1,(now-anim.t0)/anim.dur); const e=k*k*(3-2*k);
    camera.position.lerpVectors(anim.p0,anim.p1,e);
    controls.target.lerpVectors(anim.q0,anim.q1,e); if(k>=1) anim=null; }
  dynamicSizes();
  controls.update(); renderer.render(scene,camera);
  frames++; if(now-fpsT>1000){ fps=frames; frames=0; fpsT=now;
    statsEl.textContent=`${fps}fps · tiles ${tileCache.size} · ${focus>=0?'in #'+focus:'universe'}`; } }
loop();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
panelUniverse();
</script>
